# CNR's Unity input reports a 128x128 logical touch space.
touch.logicalWidth=128
touch.logicalHeight=128

# Seed the bundled Mod Manager into the private directory that the native
# compatibility layer exposes to the guest as /sdcard/CNRMods.
bootstrap.0.asset=bootstrap/CNRModManager.dll
bootstrap.0.toFilesRelative=CNRMods/CNRModManager.dll
bootstrap.0.sha256Asset=bootstrap/CNRModManager.dll.sha256
bootstrap.0.preserveCustom=true

# Seed a GitHub catalog fallback into the game's CNRMods folder once.
bootstrap.1.asset=bootstrap/repo-sources.txt
bootstrap.1.toFilesRelative=CNRMods/repo-sources.txt
bootstrap.1.sha256Asset=bootstrap/repo-sources.txt.sha256
bootstrap.1.preserveCustom=false
